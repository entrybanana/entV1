<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>entV1 보안 경고</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #101114;
            color: white;

            font-family: Arial, sans-serif;
        }

        .box {
            width: 500px;
            padding: 35px;

            border-radius: 16px;

            background: #1b1d22;

            text-align: center;
        }

        h1 {
            color: #ff5555;
        }

        #url {
            margin: 20px 0;
            padding: 15px;

            background: #101114;
            border-radius: 8px;

            word-break: break-all;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            padding: 12px 20px;

            border: 0;
            border-radius: 8px;

            cursor: pointer;
        }

        #report {
            background: #ff5555;
            color: white;
        }

        #block {
            background: #333;
            color: white;
        }

        #allow {
            background: #4da3ff;
            color: white;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>entV1 보안 경고</h1>

        <p id="message"></p>

        <div id="url"></div>

        <div class="buttons">

            <button id="report">
                해킹 링크 신고
            </button>

            <button id="block">
                차단
            </button>

            <button id="allow">
                허용하고 이동
            </button>

        </div>

    </div>

    <script src="warning.js"></script>

</body>

</html>
