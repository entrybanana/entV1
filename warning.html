<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>entV1 보안 경고</title>
    <style>
        body {
            margin: 0;
            background: #101114;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 500px;
            padding: 35px;
            border-radius: 16px;
            background: #1b1d22;
            text-align: center;
        }

        h1 {
            color: #ff5555;
        }

        #url {
            margin: 20px 0;
            padding: 15px;
            background: #101114;
            border-radius: 8px;
            word-break: break-all;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        #allow {
            background: #4da3ff;
            color: white;
        }

        #block {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>⚠️ entV1 보안 경고</h1>

    <p id="message"></p>

    <div id="url"></div>

    <button id="block">차단</button>
    <button id="allow">허용하고 이동</button>
</div>

<script src="warning.js"></script>

</body>
</html>
